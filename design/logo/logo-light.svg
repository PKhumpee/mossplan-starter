    <!-- Row 0 -->
    <rect x="0" y="0" width="20" height="20" rx="6" fill="#3F6B3A" />
    <rect x="24" y="0" width="20" height="20" rx="6" fill="#DDE5E0" />
    <rect x="48" y="0" width="20" height="20" rx="6" fill="#3F6B3A" />

    <!-- Row 1 -->
    <rect x="0" y="24" width="20" height="20" rx="6" fill="#3F6B3A" />
    
    <rect x="24" y="24" width="20" height="20" rx="6" fill="#DDE5E0" />
    <clipPath id="logo-center-clip-light">
      <rect x="24" y="24" width="20" height="20" rx="6" />
