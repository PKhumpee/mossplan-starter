    <rect x="24" y="48" width="20" height="20" rx="6" fill="#DDE5E0" />
    <rect x="48" y="48" width="20" height="20" rx="6" fill="#3F6B3A" />
  </g>

  <!-- Wordmark "mossplan" lowercase JetBrains Mono -->
  <text x="86" y="45" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="33" font-weight="600" fill="#14201A" letter-spacing="-0.5px">mossplan</text>
